<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Application Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <div class="max-w-5xl mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Job Application Tracker</h1>

    
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="card text-center">
        <p class="text-gray-500">Total</p>
        <p id="totalCount" class="text-2xl font-bold">0</p>
      </div>
      <div class="card text-center">
        <p class="text-gray-500">Interview</p>
        <p id="interviewCount" class="text-2xl font-bold">0</p>
      </div>
      <div class="card text-center">
        <p class="text-gray-500">Rejected</p>
        <p id="rejectedCount" class="text-2xl font-bold">0</p>
      </div>
    </div>

    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xl font-semibold">Available Jobs</h2>
      <span id="allJobsCount" class="text-gray-600"></span>
    </div>

    <div class="flex gap-4 mb-4">
      <button class="tab-btn font-semibold border-b-2 border-black" data-tab="all">All</button>
      <button class="tab-btn text-gray-500" data-tab="interview">Interview</button>
      <button class="tab-btn text-gray-500" data-tab="rejected">Rejected</button>
    </div>

    <div id="jobList" class="space-y-4"></div>

    <div id="emptyState" class="hidden text-center py-16">
      <div class="text-5xl mb-4">📄</div>
      <h3 class="text-xl font-semibold">No Jobs Available</h3>
      <p class="text-gray-500">You haven’t marked any jobs yet</p>
    </div>
  </div>

 
  <script src="script.js"></script>
</body>
</html>
